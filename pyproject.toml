[project]
name = "timeseries-project"
version = "0.1.0"
description = "Time-series analysis and stock forecasting with Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "statsforecast>=1.7",
    "neuralforecast>=1.7",
    "darts>=0.30",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "plotly>=6.0",
    "yfinance>=0.2",
    "lightgbm>=4.0",
    "scikit-learn>=1.4",
    "openai>=1.0",
    "pyyaml>=6.0",
    "qdrant-client>=1.19.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black", "ipykernel"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Tell setuptools which packages in the project root should be installed.
# Add future top-level packages with __init__.py to this list as needed.
[tool.setuptools]
packages = ["core", "core.fundamentals"]
